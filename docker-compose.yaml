name: beatsync

services:
  ##############################################################################
  #                                  SERVER
  ##############################################################################
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    image: beatsync-server:local
    container_name: beatsync-server
    env_file:
      - .env
    init: true
    cpus: "1.0"
    mem_limit: 1G
    mem_reservation: 256M
    ports:
      - "8080:8080"
    volumes:
      - type: volume
        source: server-data
        target: /app/apps/server/data
    restart: unless-stopped
    stop_grace_period: 15s
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const response = await fetch('http://127.0.0.1:8080/health'); if (!response.ok) process.exit(1);",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  ##############################################################################
  #                                   CLIENT
  ##############################################################################
  client:
    build:
      context: .
      dockerfile: Dockerfile.client
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL in .env}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:?Set NEXT_PUBLIC_WS_URL in .env}
        NEXT_ALLOWED_DEV_ORIGINS: ${NEXT_ALLOWED_DEV_ORIGINS:-}
    image: beatsync-client:local
    container_name: beatsync-client
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL in .env}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:?Set NEXT_PUBLIC_WS_URL in .env}
    init: true
    cpus: "0.5"
    mem_limit: 512M
    mem_reservation: 128M
    ports:
      - "3000:3000"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const response = await fetch('http://127.0.0.1:3000/'); if (!response.ok) process.exit(1);",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  server-data:
